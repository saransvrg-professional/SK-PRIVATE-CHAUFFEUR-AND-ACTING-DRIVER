<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK Chauffeur Ad Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050915;
      --bg-card: rgba(13, 22, 48, 0.7);
      --gold: #d4a017;
      --gold-glow: rgba(212, 160, 23, 0.4);
      --white: #ffffff;
      --gray: #a0a8c0;
      --border-color: rgba(212, 160, 23, 0.2);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    /* Square 1080x1080 FB/Insta post size */
    .ad-container {
      width: 1080px;
      height: 1080px;
      background-color: var(--bg-dark);
      position: relative;
      overflow: hidden;
      border: 4px solid var(--gold);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.8);
    }

    /* Background glow elements */
    .glow-circle {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 160, 23, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }
    .glow-1 { top: -100px; left: -100px; }
    .glow-2 { bottom: -100px; right: -100px; }

    /* HEADER */
    .ad-header {
      display: flex;
      align-items: center;
      gap: 25px;
      z-index: 2;
    }
    .logo-container {
      height: 120px;
      width: 120px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--gold);
      box-shadow: 0 0 20px var(--gold-glow);
      background-color: #000;
    }
    .logo-img {
      height: 100%;
      width: 100%;
      object-fit: cover;
      transform: scale(1.4); /* Crop white corners */
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-text .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 900;
      color: var(--white);
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .brand-text .main-title span {
      color: var(--gold);
      font-style: italic;
    }
    .brand-text .sub-title {
      font-size: 20px;
      color: var(--gray);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
    }

    /* CENTER AREA - High impact dual image showcase */
    .center-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      height: 480px;
      z-index: 2;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
    }
    .split-image-container {
      position: relative;
      width: 50%;
      height: 100%;
      overflow: hidden;
    }
    .split-left {
      border-right: 2px solid var(--gold);
    }
    .car-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 6s ease;
    }
    .center-card:hover .car-img {
      transform: scale(1.1);
    }
    .card-label {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(5, 9, 21, 0.85);
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 3;
    }
    .split-right .card-label {
      left: auto;
      right: 20px;
      color: #ffffff;
      border: 1.5px solid rgba(255,255,255,0.3);
    }
    .card-overlay-tagline {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--navy-dark);
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 10px 30px;
      border-radius: 30px;
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-style: italic;
      font-weight: 700;
      z-index: 4;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* SERVICES GRID - Clean 3 columns */
    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 30px;
      z-index: 2;
    }
    .service-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .service-box h4 {
      font-size: 20px;
      color: var(--gold);
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .service-box p {
      font-size: 15px;
      color: var(--gray);
      line-height: 1.4;
    }

    /* FOOTER CTA BUTTON */
    .ad-footer {
      display: flex;
      justify-content: center;
      z-index: 2;
    }
    .cta-btn {
      background: linear-gradient(135deg, var(--gold) 0%, #f0c040 100%);
      color: var(--bg-dark);
      padding: 22px 70px;
      border-radius: 50px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 15px 35px rgba(212, 160, 23, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 15px;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Ad Container -->
  <div class="ad-container">
    
    <!-- Background glows -->
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
    
    <!-- Header -->
    <div class="ad-header">
      <div class="logo-container">
        <img class="logo-img" src="Sleek SK logo with dynamic road.png" alt="SK Logo">
      </div>
      <div class="brand-text">
        <div class="main-title">SK Private <span>Chauffeur</span></div>
        <div class="sub-title">& Acting Driver</div>
      </div>
    </div>

    <!-- Center Photo Showcase (Dual Image Split) -->
    <div class="center-card">
      <div class="card-overlay-tagline">"You Relax. We Drive."</div>
      
      <!-- Left Split: Hills Drive -->
      <div class="split-image-container split-left">
        <img class="car-img" src="hills_drive_car.png" alt="Hills Drive Expert">
        <div class="card-label">⛰️ Hills Expert</div>
      </div>
      
      <!-- Right Split: Premium Interior -->
      <div class="split-image-container split-right">
        <img class="car-img" src="premium_interior.png" alt="VIP Comfort">
        <div class="card-label">👑 VIP Comfort</div>
      </div>
    </div>

    <!-- Services Grid -->
    <div class="services-grid">
      <div class="service-box">
        <h4>Outstation Trips</h4>
        <p>Comfortable long-distance drives across South India</p>
      </div>
      <div class="service-box">
        <h4>Airport Drops</h4>
        <p>Prompt drop & pick ups for Chennai & Bangalore airports</p>
      </div>
      <div class="service-box">
        <h4>Professionalism</h4>
        <p>Experienced drivers wearing clean formal attire</p>
      </div>
    </div>

    <!-- Footer CTA -->
    <div class="ad-footer">
      <button class="cta-btn">
        📞 Book Now: 96006 13619
      </button>
    </div>

  </div>

</body>
</html>
